services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Orchard AutoSetup (first run only). Credentials come from .env, never from appsettings.
      OrchardCore__OrchardCore_AutoSetup__AutoSetupPath: ""
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__ShellName: Default
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__SiteName: ${ORCHARD_SITE_NAME:-AbrIT Panel (Demo)}
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__SiteTimeZone: Asia/Tehran
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__AdminUsername: ${ORCHARD_ADMIN_USERNAME:-admin}
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__AdminEmail: ${ORCHARD_ADMIN_EMAIL:-admin@example.test}
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__AdminPassword: ${ORCHARD_ADMIN_PASSWORD:?Set ORCHARD_ADMIN_PASSWORD in .env}
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__DatabaseProvider: Sqlite
      OrchardCore__OrchardCore_AutoSetup__Tenants__0__RecipeName: AbrITPanel
      # Demo customers (optional; empty = skipped). Read by the DemoUsers recipe step.
      DEMO_CUSTOMER_A_PASSWORD: ${DEMO_CUSTOMER_A_PASSWORD:-}
      DEMO_CUSTOMER_B_PASSWORD: ${DEMO_CUSTOMER_B_PASSWORD:-}
      # Connector + mock payment (bound by Program.cs as Nextcloud:* / MockPayment:*; Real mode fails fast if incomplete).
      Nextcloud__Mode: ${NEXTCLOUD_MODE:-Mock}
      Nextcloud__BaseUrl: ${NEXTCLOUD_BASE_URL:-}
      Nextcloud__AdminUser: ${NEXTCLOUD_ADMIN_USER:-}
      Nextcloud__AppPassword: ${NEXTCLOUD_APP_PASSWORD:-}
      Nextcloud__TimeoutSeconds: ${NEXTCLOUD_TIMEOUT_SECONDS:-15}
      Nextcloud__Mock__FailNextCalls: ${NEXTCLOUD_MOCK_FAIL_NEXT_CALLS:-0}
      Nextcloud__Mock__DelayMs: ${NEXTCLOUD_MOCK_DELAY_MS:-0}
      MockPayment__WebhookSecret: ${MOCK_PAYMENT_WEBHOOK_SECRET:-}
      # E-mail (password reset): Orchard's config-based "DefaultSMTP" provider -> smtp4dev (UI on :5081; :5080 is the `dotnet run` app).
      OrchardCore__OrchardCore_Email_Smtp__DefaultSender: no-reply@abrit-panel.test
      OrchardCore__OrchardCore_Email_Smtp__DeliveryMethod: Network
      OrchardCore__OrchardCore_Email_Smtp__Host: smtp4dev
      OrchardCore__OrchardCore_Email_Smtp__Port: "25"
      OrchardCore__OrchardCore_Email_Smtp__EncryptionMethod: None
      OrchardCore__OrchardCore_Email_Smtp__AutoSelectEncryption: "false"
      OrchardCore__OrchardCore_Email_Smtp__RequireCredentials: "false"
    volumes:
      - app_data:/app/App_Data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      - smtp4dev

  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "5081:80"
      - "2525:25"

  # Optional local Nextcloud for Real-mode verification only (not an AbrIT environment):
  #   docker compose --profile nextcloud up -d nextcloud   → http://localhost:8081
  # Auto-installs with SQLite when LOCAL_NEXTCLOUD_ADMIN_PASSWORD is set; welcome mails go to smtp4dev.
  nextcloud:
    image: nextcloud:stable
    profiles: ["nextcloud"]
    ports:
      - "8081:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${LOCAL_NEXTCLOUD_ADMIN_USER:-ncadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${LOCAL_NEXTCLOUD_ADMIN_PASSWORD:-}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
      SMTP_HOST: smtp4dev
      SMTP_PORT: "25"
      MAIL_FROM_ADDRESS: nextcloud
      MAIL_DOMAIN: example.test
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - smtp4dev

volumes:
  app_data:
  nextcloud_data:
